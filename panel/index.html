<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0A0E1C">
<title>Panel Atlas Squad</title>
<style>html{color-scheme:light}body{margin:0}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Panel privado: cabecera fija, tarjetas de resumen, lista a la izquierda y detalle en un cajón a la derecha */
:root{
  --bg:#F3F5FA;--surface:#fff;--soft:#E9EDF6;--line:#D8DEEB;--ink:#0B1020;--muted:#5A6479;
  --accent:#1F4BFF;--accent-ink:#fff;--ok:#0E8F63;--okbg:#DDF5EA;--warn:#A86400;--warnbg:#FFF0D1;--bad:#C0262D;--badbg:#FDE3E3;
  --neon:#16A9FF;--gold:#F5C542;--green:#22C55E;--red:#EF4444;
  --f-body:'Inter',system-ui,sans-serif;--f-display:'Space Grotesk','Inter',sans-serif;
  --r:14px;--sh:0 18px 40px -22px rgba(11,16,32,.35);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A0E1C;--surface:#121830;--soft:#1A2240;--line:#27304F;--ink:#EEF1FA;--muted:#9AA5C0;
  --accent:#5B7BFF;--accent-ink:#06091A;--ok:#4ADE9A;--okbg:#0E3324;--warn:#F5B94A;--warnbg:#3A2A08;--bad:#FF7B80;--badbg:#3C1418;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0E1C;--surface:#121830;--soft:#1A2240;--line:#27304F;--ink:#EEF1FA;--muted:#9AA5C0;
  --accent:#5B7BFF;--accent-ink:#06091A;--ok:#4ADE9A;--okbg:#0E3324;--warn:#F5B94A;--warnbg:#3A2A08;--bad:#FF7B80;--badbg:#3C1418;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 .94rem/1.5 var(--f-body);padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100vh}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font:600 .7rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:9px 16px;font-weight:600;font-size:.86rem;white-space:nowrap;transition:transform .2s,background .2s,border-color .2s}
.btn:hover{transform:translateY(-1px);border-color:var(--muted)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.btn.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.sm{padding:6px 12px;font-size:.8rem}
.field{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.field:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 10px;font-weight:700;font-size:.72rem;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.acc{background:color-mix(in srgb,var(--accent) 16%,var(--surface));color:var(--accent)}
.sq{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--line);background:#fff}
.sq.blue{background:var(--neon);border-color:var(--neon);box-shadow:0 0 0 3px color-mix(in srgb,var(--neon) 25%,transparent),0 0 14px var(--neon)}
.sq.gold{background:var(--gold);border-color:#C99A12;box-shadow:0 0 0 3px rgba(245,197,66,.3),0 0 14px rgba(245,197,66,.8)}
.sq.green{background:var(--green);border-color:var(--green);box-shadow:0 0 0 3px rgba(34,197,94,.25)}
.sq.red{background:var(--red);border-color:var(--red);box-shadow:0 0 0 3px rgba(239,68,68,.25)}
.sq.off{opacity:.45;background:var(--soft)}
/* acceso */
.login{min-height:100vh;display:grid;place-items:center;padding-block:32px}
.login form{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--sh)}
.login .brand{display:flex;align-items:center;gap:12px;font:700 1.3rem var(--f-display)}
.login label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.86rem}
.logo{width:44px;height:44px;border-radius:12px;object-fit:contain;background:var(--soft);display:grid;place-items:center;font:700 .9rem var(--f-display);color:var(--accent);overflow:hidden}
.err{color:var(--bad);font-weight:600;font-size:.85rem;min-height:1.2em;margin:0}
/* cabecera */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top .brand{display:flex;align-items:center;gap:10px;font:700 1.05rem var(--f-display);margin-right:auto}
.top .brand .logo{width:36px;height:36px;border-radius:10px}
.wrapp{max-width:1240px;margin:0 auto;padding-block:18px 56px;display:flex;flex-direction:column;gap:18px}
.tog{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px 6px 8px;font-weight:600;font-size:.82rem}
.tog i{width:30px;height:18px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.tog i::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s}
.tog[aria-pressed=true] i{background:var(--ok)}.tog[aria-pressed=true] i::after{transform:translateX(12px)}
/* resumen */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font:700 clamp(1.1rem,5vw,1.55rem)/1.1 var(--f-display);white-space:nowrap}
.stat.hot{border-color:color-mix(in srgb,var(--warn) 50%,var(--line))}.stat.hot b{color:var(--warn)}
.stat.risk{border-color:color-mix(in srgb,var(--bad) 50%,var(--line))}.stat.risk b{color:var(--bad)}
.stat.good b{color:var(--ok)}
/* pestañas */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{border:0;background:none;padding:9px 16px;border-radius:99px;font-weight:600;color:var(--muted);white-space:nowrap;display:inline-flex;gap:7px;align-items:center}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg)}
.tabs .cnt{background:var(--soft);color:var(--muted);border-radius:99px;font-size:.72rem;padding:0 7px}
.tabs button[aria-selected=true] .cnt{background:color-mix(in srgb,var(--bg) 25%,transparent);color:var(--bg)}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
@media (max-width:640px){.filters{grid-template-columns:1fr}}
/* lista */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;width:100%;transition:border-color .2s,transform .2s}
.row:hover{border-color:var(--accent);transform:translateY(-1px)}
.row.sel{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.row.new{animation:flash 2.4s ease-out}
@keyframes flash{from{background:color-mix(in srgb,var(--gold) 45%,var(--surface))}}
.row .t1{font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .t2{color:var(--muted);font-size:.84rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.row .r b{font-family:var(--f-display)}
.row.cancel{opacity:.55}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}
/* activados */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.act{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.act .hd{display:flex;gap:10px;align-items:center}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.bar.y i{background:#E5A100}.bar.r i{background:var(--bad)}
.cd{font-weight:700}.cd.y{color:var(--warn)}.cd.r{color:var(--bad)}.cd.g{color:var(--ok)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
h3.sec{font-size:1rem;margin-top:6px}
/* cajón de detalle */
.shade{position:fixed;inset:0;background:rgba(5,8,18,.5);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);z-index:41;background:var(--bg);border-left:1px solid var(--line);display:flex;flex-direction:column;box-shadow:-24px 0 60px rgba(0,0,0,.3);padding-top:env(safe-area-inset-top,0px);animation:slide .25s ease-out}
@keyframes slide{from{transform:translateX(28px);opacity:0}}
.drawer .dh{display:flex;gap:10px;align-items:center;padding:14px max(16px,env(safe-area-inset-right,0px)) 12px 16px;border-bottom:1px solid var(--line)}
.drawer .dh h3{margin-right:auto;font-size:1.1rem}
.drawer .db{overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 40px 16px;display:flex;flex-direction:column;gap:16px;flex:1}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:4px 10px;font-size:.88rem}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:.8rem;font-weight:600;display:inline-flex;align-items:center;gap:7px}
.seg button[aria-pressed=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--accent)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th{font:600 .7rem var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{border:0;padding:3px 8px}
.s-in{width:130px;text-align:right}
.s-edit input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.new-c{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end}
.new-c label{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:.82rem}
/* confirmación y avisos */
.dlg{position:fixed;inset:0;z-index:60;background:rgba(5,8,18,.6);display:grid;place-items:center;padding:16px}
.dlg .c{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:12px;box-shadow:var(--sh)}
.dlg .c p{margin:0;color:var(--muted)}
.dlg .bt{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#toasts{position:fixed;z-index:70;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;width:min(92vw,520px);pointer-events:none}
.toast{background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 16px;font-weight:600;font-size:.88rem;box-shadow:var(--sh);animation:slide .2s ease-out}
.toast.bad{background:var(--bad);color:#fff}
.sk{height:60px;border-radius:var(--r);background:linear-gradient(90deg,var(--soft),var(--surface),var(--soft));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
(function(){
'use strict';
var $ = function(s, r){ return (r || document).querySelector(s); };
var DAY = 86400000;
var cop = new Intl.NumberFormat('es-CO', {style:'currency', currency:'COP', maximumFractionDigits:0});
var S = {tok:null, orders:[], servicios:[], cupones:[], tab:'pedidos', q:'', cls:'', est:'', auto:false, sel:null, maxId:0, loaded:false, newIds:{}, timer:null, refreshT:null, loading:false};
try{ S.auto = sessionStorage.getItem('asq-auto') === '1'; }catch(e){}

function h(tag, a){
  var e = document.createElement(tag);
  if(a) Object.keys(a).forEach(function(k){
    var v = a[k]; if(v == null || v === false) return;
    if(k === 'class') e.className = v; else if(k === 'text') e.textContent = v;
    else if(k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
    else if(k === 'value') e.value = v; else e.setAttribute(k, v === true ? '' : v);
  });
  (function add(list){ for(var i = 0; i < list.length; i++){ var c = list[i]; if(c == null || c === false) continue; if(Array.isArray(c)) add(c); else e.appendChild(typeof c === 'object' ? c : document.createTextNode(c)); } })(Array.prototype.slice.call(arguments, 2));
  return e;
}
function toast(msg, bad){ var t = h('div', {class:'toast' + (bad ? ' bad' : ''), text:msg}); $('#toasts').appendChild(t); setTimeout(function(){ t.remove(); }, bad ? 6000 : 3500); }
function fdate(d){ return d ? new Date(d).toLocaleString('es-CO', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'}) : ''; }
function fday(d){ return new Date(d).toLocaleDateString('es-CO', {day:'2-digit', month:'short', year:'numeric'}); }
function ago(d){ var s = Math.max(0, (Date.now() - new Date(d)) / 1000); if(s < 60) return 'hace unos segundos'; if(s < 3600) return 'hace ' + Math.round(s / 60) + ' min'; if(s < 86400) return 'hace ' + Math.round(s / 3600) + ' h'; return fdate(d); }
function digits(s){ return String(s || '').replace(/\D/g, ''); }
function lat(s){ return String(s || '').replace(/[^\u0000-ÿ]/g, ''); }

/* ---------- conexión con Supabase ---------- */
function saveTok(t){ S.tok = t; try{ if(t) sessionStorage.setItem('asq-tok', JSON.stringify(t)); else sessionStorage.removeItem('asq-tok'); }catch(e){} }
try{ var st = JSON.parse(sessionStorage.getItem('asq-tok') || 'null'); if(st && st.access) S.tok = st; }catch(e){}
function authCall(path, body){ return fetch(CFG.url + '/auth/v1/' + path, {method:'POST', headers:{'Content-Type':'application/json', apikey:CFG.key}, body:JSON.stringify(body)}); }
function takeSession(j){ saveTok({access:j.access_token, refresh:j.refresh_token, exp:Date.now() + (j.expires_in || 3600) * 1000, email:(j.user && j.user.email) || (S.tok && S.tok.email) || ''}); scheduleRefresh(); }
function scheduleRefresh(){
  clearTimeout(S.refreshT); if(!S.tok) return;
  S.refreshT = setTimeout(doRefresh, Math.max(10000, S.tok.exp - Date.now() - 90000));
}
function doRefresh(){
  if(!S.tok || !S.tok.refresh) return Promise.resolve(false);
  return authCall('token?grant_type=refresh_token', {refresh_token:S.tok.refresh}).then(function(r){ return r.ok ? r.json() : Promise.reject(); })
    .then(function(j){ takeSession(j); return true; }, function(){ saveTok(null); render(); return false; });
}
function api(path, o){
  o = o || {};
  function go(){
    return fetch(CFG.url + '/rest/v1/' + path, {method:o.method || 'GET', headers:Object.assign({'Content-Type':'application/json', apikey:CFG.key, Authorization:'Bearer ' + (S.tok ? S.tok.access : CFG.key), Prefer:o.prefer || 'return=representation'}, o.headers || {}), body:o.body ? JSON.stringify(o.body) : undefined});
  }
  return go().then(function(r){
    if(r.status === 401) return doRefresh().then(function(ok){ return ok ? go() : r; });
    return r;
  }).then(function(r){
    if(!r.ok) return r.text().then(function(t){ var m = ''; try{ m = JSON.parse(t).message || ''; }catch(e){} throw new Error(m || ('Error ' + r.status)); });
    return r.status === 204 ? null : r.json().catch(function(){ return null; });
  });
}

/* ---------- datos ---------- */
function loadOrders(silent){
  if(S.loading) return Promise.resolve(); S.loading = true;
  return api('pedidos?select=*&order=creado_en.desc&limit=1000').then(function(rows){
